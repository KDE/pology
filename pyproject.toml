[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pology"
dynamic = ["version"]
description = "Python library and command-line tools for in-depth processing of PO files"
readme = "README.rst"
requires-python = ">=3.7"
license = "GPL-3.0-or-later"
authors = [
    {name = "Chusslove Illich", email = "caslav.ilic@gmx.net"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
]

[project.urls]
Source = "https://invent.kde.org/sdk/pology"
Issues = "https://invent.kde.org/sdk/pology/-/issues"
Changelog = "https://invent.kde.org/sdk/pology/-/blob/master/NEWS"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["pology"]

[tool.hatch.build.targets.sdist]
include = [
    "/pology",
    "/tests",
    "/VERSION",
    "/README.rst",
    "/COPYING.GPLv3",
    "/COPYING.BSD",
]
